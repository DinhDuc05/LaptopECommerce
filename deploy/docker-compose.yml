services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: laptop_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - laptop_net

  backend:
    image: "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/laptop-backend:${IMAGE_TAG:-latest}"
    container_name: laptop_backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "200"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 300m
    cpus: 0.75
    networks:
      - laptop_net

  frontend:
    image: "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/laptop-frontend:${IMAGE_TAG:-latest}"
    container_name: laptop_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    mem_limit: 300m
    cpus: 0.75
    networks:
      - laptop_net

  nginx:
    image: nginx:alpine
    container_name: laptop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    mem_limit: 64m
    cpus: 0.25
    networks:
      - laptop_net

volumes:
  mssql_data:

networks:
  laptop_net:
    driver: bridge
